<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onore Cafe — Παραγγελία</title>
<meta name="theme-color" content="#16222e">
<meta name="description" content="Onore Cafe, Κυπαρισσία — online παραγγελία για pickup ή delivery.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onore">
<style>
:root{
  --ink:#16222e; --ink2:#22323f; --bg:#faf7f2; --card:#ffffff;
  --accent:#b23a2e; --gold:#c6973f; --muted:#6b7580; --line:#ece6dc;
  --ok:#128c4b; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  padding-bottom:88px;}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto}

/* Header */
header.hero{background:var(--ink);color:#fff;padding:26px 18px 18px;
  position:relative;text-align:center}
.brand-estd{font-size:10px;letter-spacing:3px;opacity:.7;margin-bottom:4px}
.brand{font-size:30px;letter-spacing:9px;font-weight:700;margin:0}
.brand-sub{font-size:11px;letter-spacing:5px;opacity:.85;margin-top:4px}
.hero-meta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;
  font-size:12.5px;opacity:.9}
.hero-meta span{display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* Search + category nav */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:10px 12px;border-bottom:1px solid var(--line)}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:11px 14px;font-size:15px;outline:none}
.catnav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 2px;scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catnav button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink2);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.catnav button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Sections */
main{padding:6px 12px 20px}
.cat{scroll-margin-top:120px;margin-top:18px}
.cat h2{font-size:19px;margin:0 0 2px;letter-spacing:.3px}
.cat .en{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.cat .note{font-size:12px;color:var(--accent);margin:6px 0 2px}
.cat hr{border:none;border-top:2px solid var(--ink);opacity:.15;margin:8px 0 4px}

.item{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.item .info{flex:1;min-width:0}
.item .n{font-size:15px;font-weight:600;line-height:1.25}
.item .e{font-size:12px;color:var(--muted);margin-top:2px}
.item .p{font-size:14px;font-weight:700;color:var(--ink);margin-top:5px}
.item .add{flex:none;width:38px;height:38px;border-radius:50%;border:none;
  background:var(--ink);color:#fff;font-size:22px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.item .add:active{transform:scale(.92)}
.qtybox{flex:none;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;
  border-radius:999px;padding:4px 6px}
.qtybox button{width:28px;height:28px;border:none;background:transparent;color:#fff;font-size:20px;cursor:pointer}
.qtybox b{min-width:16px;text-align:center;font-size:15px}

/* Cart bar + drawer */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));background:transparent;
  transform:translateY(120%);transition:transform .25s}
.cartbar.show{transform:translateY(0)}
.cartbar .inner{max-width:720px;margin:0 auto;background:var(--accent);color:#fff;border-radius:14px;
  display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.cartbar .count{background:#fff;color:var(--accent);border-radius:999px;padding:2px 9px;font-weight:700;font-size:13px;margin-right:8px}
.cartbar .lbl{font-weight:700}
.cartbar .tot{font-weight:800}

.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet .back{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;
  background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  max-width:720px;margin:0 auto}
.sheet h3{margin:4px 0 12px;font-size:18px}
.sheet .close{position:absolute;right:14px;top:12px;background:none;border:none;font-size:26px;cursor:pointer;color:var(--muted)}
.cartline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cartline .cn{flex:1;font-size:14px}
.cartline .cp{font-weight:700;font-size:14px;min-width:60px;text-align:right}
.sum{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.sum.total{font-size:17px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}

.seg{display:flex;gap:8px;margin:10px 0}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;background:#fff;outline:none}
.field textarea{min-height:60px;resize:vertical}
.cta{width:100%;border:none;background:var(--ok);color:#fff;font-size:17px;font-weight:800;
  border-radius:14px;padding:16px;margin-top:14px;cursor:pointer}
.cta[disabled]{opacity:.5}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
.banner{background:#fff3cd;color:#664d03;border:1px solid #ffe69c;border-radius:10px;
  padding:9px 12px;font-size:12.5px;margin:10px 12px 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px 10px}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="brand-estd">ESTD 1981</div>
    <h1 class="brand">ONORE</h1>
    <div class="brand-sub">KYPARISSIA</div>
    <div class="hero-meta">
      <span><span class="dot"></span> Παραλαβή &amp; Delivery</span>
      <span><span class="dot"></span> Πληρωμή στην παράδοση</span>
    </div>
  </div>
</header>

<div id="demoBanner" class="banner wrap" style="display:none"></div>

<div class="tools">
  <div class="wrap"><input id="search" class="search" placeholder="Αναζήτηση στο μενού…" autocomplete="off"></div>
</div>
<nav class="catnav wrap" id="catnav"></nav>

<main class="wrap" id="menu"></main>

<footer>Onore Cafe · Κυπαρισσία Μεσσηνίας<br>Online παραγγελία · χωρίς προμήθειες</footer>

<!-- Cart bar -->
<div class="cartbar" id="cartbar">
  <div class="inner" onclick="openCart()">
    <div><span class="count" id="cbCount">0</span><span class="lbl">Καλάθι</span></div>
    <div class="tot" id="cbTotal">0,00 €</div>
  </div>
</div>

<!-- Checkout sheet -->
<div class="sheet" id="sheet">
  <div class="back" onclick="closeCart()"></div>
  <div class="panel">
    <button class="close" onclick="closeCart()">×</button>
    <h3>Η παραγγελία σου</h3>
    <div id="cartLines"></div>
    <div id="sums"></div>

    <div class="seg" id="modeSeg">
      <button data-mode="pickup" class="on" onclick="setMode('pickup')">Παραλαβή</button>
      <button data-mode="delivery" onclick="setMode('delivery')">Delivery</button>
    </div>

    <div class="field"><label>Όνομα</label><input id="fName" placeholder="Το όνομά σου"></div>
    <div class="field"><label>Τηλέφωνο</label><input id="fPhone" inputmode="tel" placeholder="69…"></div>
    <div class="field" id="addrField" style="display:none"><label>Διεύθυνση (για delivery)</label><input id="fAddr" placeholder="Οδός, αριθμός, όροφος"></div>
    <div class="field"><label>Ώρα</label><input id="fTime" placeholder="Π.χ. το συντομότερο / 18:30"></div>
    <div class="field"><label>Σημειώσεις (προαιρετικά)</label><textarea id="fNotes" placeholder="Αλλεργίες, οδηγίες…"></textarea></div>

    <button class="cta" id="submitBtn" onclick="submitOrder()">Αποστολή παραγγελίας στο WhatsApp</button>
    <div class="hint">Η παραγγελία ανοίγει στο WhatsApp έτοιμη — πατάς απλώς «αποστολή».<br>Πληρωμή κατά την παραλαβή / παράδοση.</div>
  </div>
</div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script>
const fmt = n => n.toFixed(2).replace('.',',') + ' €';
const CART = JSON.parse(localStorage.getItem('onore_cart')||'{}');
const byId = {};
ONORE_MENU.forEach(c=>c.items.forEach((it,i)=>{it._id=c.id+'_'+i;byId[it._id]=it;}));

function saveCart(){localStorage.setItem('onore_cart',JSON.stringify(CART));}
function qty(id){return CART[id]||0;}
function setQty(id,q){ if(q<=0) delete CART[id]; else CART[id]=q; saveCart(); renderItemCtrl(id); renderBar(); if(sheetOpen) renderCart(); }

/* Build menu */
const menuEl=document.getElementById('menu'), navEl=document.getElementById('catnav');
ONORE_MENU.forEach(c=>{
  const b=document.createElement('button'); b.textContent=c.gr; b.onclick=()=>document.getElementById('cat_'+c.id).scrollIntoView({behavior:'smooth',block:'start'});
  b.dataset.cat=c.id; navEl.appendChild(b);
  const sec=document.createElement('section'); sec.className='cat'; sec.id='cat_'+c.id;
  let html=`<div class="en">${c.en}</div><h2>${c.gr}</h2>`;
  if(c.note) html+=`<div class="note">${c.note}</div>`;
  html+='<hr>';
  c.items.forEach(it=>{
    html+=`<div class="item" data-id="${it._id}" data-search="${(it.n+' '+(it.e||'')).toLowerCase()}">
      <div class="info"><div class="n">${it.n}</div>${it.e?`<div class="e">${it.e}</div>`:''}<div class="p">${fmt(it.p)}</div></div>
      <div class="ctrl" id="ctrl_${it._id}"></div></div>`;
  });
  sec.innerHTML=html; menuEl.appendChild(sec);
});
ONORE_MENU.forEach(c=>c.items.forEach(it=>renderItemCtrl(it._id)));

function renderItemCtrl(id){
  const el=document.getElementById('ctrl_'+id); if(!el) return;
  const q=qty(id);
  if(q<=0){ el.innerHTML=`<button class="add" aria-label="Προσθήκη">+</button>`; el.querySelector('button').onclick=()=>setQty(id,1); }
  else { el.innerHTML=`<div class="qtybox"><button aria-label="-">−</button><b>${q}</b><button aria-label="+">+</button></div>`;
    const [m,p]=el.querySelectorAll('button'); m.onclick=()=>setQty(id,q-1); p.onclick=()=>setQty(id,q+1); }
}

/* Cart bar */
function cartArr(){return Object.keys(CART).map(id=>({it:byId[id],q:CART[id]})).filter(x=>x.it);}
function subtotal(){return cartArr().reduce((s,x)=>s+x.it.p*x.q,0);}
function count(){return cartArr().reduce((s,x)=>s+x.q,0);}
function renderBar(){
  const n=count(); const bar=document.getElementById('cartbar');
  document.getElementById('cbCount').textContent=n;
  document.getElementById('cbTotal').textContent=fmt(subtotal());
  bar.classList.toggle('show',n>0);
}

/* Sheet */
let sheetOpen=false, mode='pickup';
function openCart(){ if(count()<=0) return; document.getElementById('sheet').classList.add('open'); sheetOpen=true; renderCart(); }
function closeCart(){ document.getElementById('sheet').classList.remove('open'); sheetOpen=false; }
function setMode(m){ mode=m; document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  document.getElementById('addrField').style.display = m==='delivery'?'block':'none'; renderCart(); }
function deliveryFee(){ return (mode==='delivery') ? (CONFIG.deliveryFee||0) : 0; }

function renderCart(){
  const lines=document.getElementById('cartLines');
  lines.innerHTML = cartArr().map(x=>`<div class="cartline">
     <div class="qtybox"><button onclick="setQty('${x.it._id}',${x.q-1})">−</button><b>${x.q}</b><button onclick="setQty('${x.it._id}',${x.q+1})">+</button></div>
     <div class="cn">${x.it.n}</div><div class="cp">${fmt(x.it.p*x.q)}</div></div>`).join('');
  const sub=subtotal(), fee=deliveryFee();
  let s=`<div class="sum"><span>Υποσύνολο</span><span>${fmt(sub)}</span></div>`;
  if(mode==='delivery') s+=`<div class="sum"><span>Delivery</span><span>${fee>0?fmt(fee):'Δωρεάν'}</span></div>`;
  s+=`<div class="sum total"><span>Σύνολο</span><span>${fmt(sub+fee)}</span></div>`;
  document.getElementById('sums').innerHTML=s;
  const minOk = sub >= (CONFIG.minOrder||0);
  document.getElementById('submitBtn').disabled = !minOk;
  document.getElementById('submitBtn').textContent = minOk ? 'Αποστολή παραγγελίας στο WhatsApp'
     : `Ελάχιστη παραγγελία ${fmt(CONFIG.minOrder||0)}`;
}

function submitOrder(){
  const name=val('fName'), phone=val('fPhone'), time=val('fTime'), notes=val('fNotes'), addr=val('fAddr');
  if(!name||!phone){ alert('Συμπλήρωσε όνομα και τηλέφωνο.'); return; }
  if(mode==='delivery' && !addr){ alert('Συμπλήρωσε διεύθυνση για delivery.'); return; }
  const sub=subtotal(), fee=deliveryFee();
  let t=`*Νέα παραγγελία — Onore Cafe*%0A%0A`;
  t+=`*Τύπος:* ${mode==='delivery'?'Delivery':'Παραλαβή'}%0A`;
  t+=`*Όνομα:* ${enc(name)}%0A*Τηλέφωνο:* ${enc(phone)}%0A`;
  if(mode==='delivery') t+=`*Διεύθυνση:* ${enc(addr)}%0A`;
  if(time) t+=`*Ώρα:* ${enc(time)}%0A`;
  t+=`%0A*Προϊόντα:*%0A`;
  cartArr().forEach(x=>{ t+=`• ${x.q} × ${enc(x.it.n)} — ${fmt(x.it.p*x.q)}%0A`; });
  t+=`%0A*Υποσύνολο:* ${fmt(sub)}%0A`;
  if(mode==='delivery') t+=`*Delivery:* ${fee>0?fmt(fee):'Δωρεάν'}%0A`;
  t+=`*Σύνολο:* ${fmt(sub+fee)}%0A*Πληρωμή:* στην παράδοση%0A`;
  if(notes) t+=`%0A*Σημειώσεις:* ${enc(notes)}%0A`;
  const num=(CONFIG.whatsapp||'').replace(/[^0-9]/g,'');
  window.open(`https://wa.me/${num}?text=${t}`,'_blank');
}
function val(id){return (document.getElementById(id).value||'').trim();}
function enc(s){return encodeURIComponent(s).replace(/%0A/g,' ');}

/* Search */
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  document.querySelectorAll('.item').forEach(it=>{ it.style.display = (!q||it.dataset.search.includes(q))?'flex':'none'; });
  document.querySelectorAll('.cat').forEach(sec=>{
    const any=[...sec.querySelectorAll('.item')].some(i=>i.style.display!=='none');
    sec.style.display=any?'block':'none';
  });
});

/* Active category on scroll */
const io=new IntersectionObserver(es=>{es.forEach(e=>{ if(e.isIntersecting){
  const id=e.target.id.replace('cat_',''); document.querySelectorAll('#catnav button').forEach(b=>b.classList.toggle('active',b.dataset.cat===id));
}});},{rootMargin:'-110px 0px -70% 0px'});
document.querySelectorAll('.cat').forEach(s=>io.observe(s));

/* Demo banner if whatsapp not configured */
if(!CONFIG.whatsapp || CONFIG.whatsapp.includes('XXX')){
  const b=document.getElementById('demoBanner'); b.style.display='block';
  b.textContent='DEMO: ο αριθμός WhatsApp δεν έχει μπει ακόμη — η παραγγελία θα ανοίγει το WhatsApp αλλά χωρίς σωστό παραλήπτη μέχρι να μπει ο αριθμός του Onore.';
}

renderBar();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
